[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "radiology-workbench"
version = "3.1.0"
description = "Radiology Workbench backend: CT inspection, curation and radiomics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "python-ulid>=3.0",
  "numpy>=2.0",
  "nibabel>=5.2",
  "scikit-image>=0.24",
  "pyarrow>=17",
  "duckdb>=1.1",
  "scikit-learn>=1.5",
  "pillow>=10.4",  # WebP thumbnails
  "scipy>=1.15",  # Welch ANOVA needs f_oneway(equal_var=False)
  "pydicom>=3.0",
  "SimpleITK>=2.3",  # DICOM series → NIfTI with geometry
  "isal>=1.8,<2",
]

[project.optional-dependencies]
# PyPI has no cp312 wheels and its 3.1.0 sdist is broken; this upstream commit is verified on
# Python 3.12 against the IBSI digital phantom.
radiomics = [
  "pyradiomics @ git+https://github.com/AIM-Harvard/pyradiomics@8ed579383b44806651c463d5e691f3b2b57522ab",
  "PyWavelets>=1.6",
]
umap = ["umap-learn>=0.5"]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-xdist>=3.6",
  "vulture>=2.11",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "..", "../plugins/dicom/src"]  # `..`: repo-level `plugins/`; then `rw_dicom`
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tools", "tests"]
known-third-party = ["plugins", "rw_dicom"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "tools", "plugins", "rw_dicom"]
mypy_path = "..:../plugins/dicom/src"
exclude = ["/plugins/dicom/src/"]

[[tool.mypy.overrides]]
module = [
  "nibabel.*", "skimage.*", "sklearn.*", "duckdb.*", "pyarrow.*", "sse_starlette.*",
  "radiomics.*", "SimpleITK.*", "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# nibabel ships partial type hints; allow calls to its untyped API.
module = ["app.*", "tools.*", "plugins.*", "rw_dicom.*"]
disallow_untyped_calls = false
