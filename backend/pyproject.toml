[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "radiology-workbench"
version = "3.0.0.dev0"
description = "Radiology Workbench backend: CT inspection, curation and radiomics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "python-ulid>=3.0",
  "numpy>=2.0",
  "nibabel>=5.2",
  "scikit-image>=0.24",
  "pyarrow>=17",
  "duckdb>=1.1",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
# PyRadiomics on Python 3.12 is verified in the P1 spike (ADR-0006); kept separate until then.
radiomics = ["pyradiomics", "SimpleITK>=2.3", "PyWavelets>=1.6"]
umap = ["umap-learn>=0.5"]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "tools"]

[[tool.mypy.overrides]]
module = ["nibabel.*", "skimage.*", "sklearn.*", "duckdb.*", "pyarrow.*", "sse_starlette.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# nibabel ships partial type hints; allow calls to its untyped API.
module = ["app.*", "tools.*"]
disallow_untyped_calls = false
