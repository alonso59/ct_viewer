name: Verify application and task safety

on:
  pull_request:
  push:
    branches: [version_3-dev-seg]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build isolated full-test environment
        run: >-
          docker build -f Dockerfile.verify
          --build-arg VERIFY_UID="$(id -u)" --build-arg VERIFY_GID="$(id -g)"
          -t rw-verification .
      - name: Lint, types, full tests, API contracts, requirements and bundle
        run: docker run --rm --init rw-verification make check RUNTIME=native VENV=/opt/ci FULL_TESTS=1
      - name: Serial runner safety regressions
        run: docker run --rm --init rw-verification make test-runner VENV=/opt/ci FULL_TESTS=1 PYTEST_WORKERS=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-diagnostics
          path: build/ci/
          if-no-files-found: ignore
          retention-days: 7
  browser:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build isolated full-test environment
        run: >-
          docker build -f Dockerfile.verify
          --build-arg VERIFY_UID="$(id -u)" --build-arg VERIFY_GID="$(id -g)"
          -t rw-verification .
      - name: Real-backend browser regressions
        run: |
          mkdir -p build/ci/browser-results build/ci/browser-report
          docker run --rm --init --shm-size=1g \
            -e E2E_XVFB=1 -e LIBGL_ALWAYS_SOFTWARE=1 -e LP_NUM_THREADS=2 \
            -v "$PWD/build/ci/browser-results:/repo/frontend/test-results" \
            -v "$PWD/build/ci/browser-report:/repo/frontend/playwright-report" \
            rw-verification xvfb-run -a make fixtures e2e RUNTIME=native VENV=/opt/ci PROJECT=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics-${{ matrix.project }}
          path: build/ci/
          if-no-files-found: ignore
          retention-days: 7
  image:
    needs: [verify, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the product image
        run: docker build -t radiology-workbench:verification .
      - name: Generate disposable synthetic sources
        run: |
          mkdir -p .fixtures
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/.fixtures:/fixtures" radiology-workbench:verification \
            python -m tools.make_fixtures --out /fixtures/synthetic
      - name: Verify Docker runtime, arbitrary UID, health, IBSI and immutable sources
        run: |
          docker run --rm radiology-workbench:verification \
            python -c 'import pyarrow as pa; assert pa.default_memory_pool().backend_name == "system"'
          IMAGE=radiology-workbench:verification scripts/container-smoke.sh
      - name: Verify native DICOM conversion and durable Open after API restart
        run: |
          mkdir -p build/ci/image-lifecycle
          docker run --rm --init --user "$(id -u):$(id -g)" \
            -v "$PWD/build/ci/image-lifecycle:/evidence" radiology-workbench:verification \
            python -m tools.dicom_image_smoke --evidence /evidence
      - name: Verify DICOM ownership across separate Docker PID namespaces
        run: >-
          python3 scripts/dicom-namespace-smoke.py radiology-workbench:verification
          "$PWD/build/ci/image-namespaces"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: product-image-diagnostics
          path: |
            build/ci/image-lifecycle
            build/ci/image-namespaces
          if-no-files-found: ignore
          retention-days: 7
      - name: Save the tested image for udocker acceptance
        run: |
          mkdir -p build/ci
          docker save radiology-workbench:verification -o build/ci/radiology-workbench.tar
          sha256sum build/ci/radiology-workbench.tar > build/ci/radiology-workbench.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: verified-product-image
          path: build/ci/radiology-workbench.tar*
          retention-days: 7
