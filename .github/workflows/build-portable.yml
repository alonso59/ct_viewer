name: Build Portable Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: radiology-webui-windows
            exe_name: radiology-webui.exe
            platform_id: windows
          - os: macos-latest
            artifact_name: radiology-webui-macos
            exe_name: radiology-webui
            platform_id: macos
          - os: ubuntu-22.04
            artifact_name: radiology-webui-linux
            exe_name: radiology-webui
            platform_id: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node / frontend ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── Python / backend ─────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      # ── Build executable ─────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: >
          pyinstaller
          backend/radiology-webui.spec
          --distpath dist/portable
          --workpath build/pyinstaller
          --noconfirm

      # ── Linux: install UPX for smaller binary ────────────────────────────
      - name: Install UPX (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get install -y upx-ucl

      # ── Package output ───────────────────────────────────────────────────
      - name: List output
        shell: bash
        run: ls -lh dist/portable/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/portable/
          retention-days: 30
