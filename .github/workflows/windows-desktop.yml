name: Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "src-tauri/**"
      - "scripts/build-desktop.ps1"
      - "scripts/build-portable-windows.ps1"
      - "toolchains/desktop-windows-x64.json"
      - ".python-version"
      - ".node-version"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "src-tauri/**"
      - "scripts/build-desktop.ps1"
      - "scripts/build-portable-windows.ps1"
      - "toolchains/desktop-windows-x64.json"
      - ".python-version"
      - ".node-version"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          architecture: x64
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: backend/requirements-desktop.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install pinned Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build and verify Windows desktop distribution
        shell: pwsh
        run: ./scripts/build-portable-windows.ps1

      - name: Verify release artifact inventory and checksums
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD 'artifacts\windows-x64'
          $required = @(
            'Radiology-Desktop_2.2.0_x64-setup.exe',
            'Radiology-Desktop_2.2.0_x64-setup.exe.sha256',
            'Radiology-Desktop_2.2.0_x64-portable.zip',
            'radiology-backend-x86_64-pc-windows-msvc.exe',
            'build-manifest.json',
            'toolchain-manifest.json',
            'SHA256SUMS.txt',
            'build.log'
          )
          foreach ($name in $required) {
            $path = Join-Path $artifactRoot $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release artifact is missing: $name"
            }
          }

          $buildManifest = Get-Content -LiteralPath (Join-Path $artifactRoot 'build-manifest.json') -Raw | ConvertFrom-Json
          if ($buildManifest.artifacts.Count -ne 3 -or $buildManifest.portableContents.Count -ne 2) {
            throw 'Build manifest does not describe the complete release inventory.'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $portableZip = Join-Path $artifactRoot 'Radiology-Desktop_2.2.0_x64-portable.zip'
          $archive = [IO.Compression.ZipFile]::OpenRead($portableZip)
          try {
            $entries = @($archive.Entries | Where-Object Name | ForEach-Object { $_.FullName.Replace('\', '/') })
          }
          finally {
            $archive.Dispose()
          }
          $expectedEntries = @('Radiology-Desktop.exe', 'radiology-backend.exe')
          if (Compare-Object -ReferenceObject $expectedEntries -DifferenceObject $entries) {
            throw "Portable ZIP inventory is invalid: $($entries -join ', ')"
          }

          foreach ($line in Get-Content -LiteralPath (Join-Path $artifactRoot 'SHA256SUMS.txt')) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Invalid checksum line: $line"
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $artifactRoot $Matches[2])).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) {
              throw "Checksum mismatch for $($Matches[2])"
            }
          }

      - name: Upload installer and reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiology-desktop-windows-x64
          path: |
            artifacts/windows-x64/**
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/**
            backend/.runtime/**
          if-no-files-found: warn
          retention-days: 14
