services:
  radiology-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: radiology-ui:1.0
    container_name: radiology-ui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-8000}:8000"
    environment:
      DATA_ROOT: /data
      DATASET_ROOTS: "${DATASET_ROOTS:-}"
      RADIOLOGY_UI_TOKEN: "${RADIOLOGY_UI_TOKEN:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      ALLOW_DATA_MUTATIONS: "${ALLOW_DATA_MUTATIONS:-false}"
      WEBUI_STATE_DIR: /state
    volumes:
      - "${DATASET_DIR:-./data/dataset}:/data:ro"
      - "${WEBUI_STATE_DIR_HOST:-./webui_state}:/state:rw"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
